name = "mench"
main = "worker/index.ts"
compatibility_date = "2024-11-12"
# Wrangler/esbuild does not read tsconfig paths; mirror @game/* from tsconfig.worker.json.
tsconfig = "tsconfig.worker.json"

[alias]
"@game/rules" = "./src/game/rules.ts"
"@game/ai" = "./src/game/ai/index.ts"
"@game/types" = "./src/game/types.ts"
"@game/online/protocol.ts" = "./src/game/online/protocol.ts"

# Free-tier dev defaults; DO uses SQLite storage class (current Wrangler default).
[durable_objects]
bindings = [{ name = "GAME_ROOM", class_name = "GameRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# SPA from `pnpm build` — same origin as `/api/*` (no CORS split in production).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[dev]
port = 8787

# Production (`pnpm deploy` → `wrangler deploy --env production`).
[env.production]
# Optional custom domain after the zone is on your account:
# routes = [{ pattern = "play.example.com", custom_domain = true }]

[env.production.durable_objects]
bindings = [{ name = "GAME_ROOM", class_name = "GameRoom" }]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
