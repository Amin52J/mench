<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e88e5" />
    <title>Mench — Offline</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
        color: #111827;
        background: #ffffff;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        max-width: 22rem;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mench</h1>
      <p>You are offline. Online rooms need a network connection. Reconnect and reload to play with friends.</p>
    </main>
  </body>
</html>
